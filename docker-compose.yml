
services:
  api:
    image: myapp-api:1.0
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      Message: "${APP_MESSAGE:-Hello from Docker Compose!}"
    depends_on:
      - db

  web:
    image: myapp-web:1.0
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:5000"
    ports:
      - "5173:80"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in your .env file}"
      POSTGRES_DB: appdb
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
